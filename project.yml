name: AhorroCompartido
options:
  bundleIdPrefix: com.ahorrocompartido
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AhorroCompartido:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - ViewModels
      - Views
      - Helpers
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahorrocompartido.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
